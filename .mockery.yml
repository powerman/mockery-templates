# mockery generates code from interfaces listed here using templates.
# Each placement of generated code has an anchor;
# an interface uses one (config) or several (configs).
log-level: warn
formatter: goimports
formatter-options:
  goimports:
    local-prefix: github.com/powerman/mockery-templates
_anchors:
  go-mockgen: &go-mockgen
    template: file://go-mockgen/go-mockgen.templ
    dir: '{{.InterfaceDirRelative}}'
    pkgname: '{{.SrcPackageName}}'
    filename: 'stub.{{.InterfaceFile | base}}'
    structname: 'Mock{{.InterfaceName | firstUpper}}'
  go-mockgen-internal-test: &go-mockgen-internal-test
    template: file://go-mockgen/go-mockgen.templ
    dir: '{{.InterfaceDirRelative}}'
    pkgname: '{{.SrcPackageName}}'
    filename: 'stub.internal_test.go'
    structname: 'MockInternal{{.InterfaceName | firstUpper}}'
  go-mockgen-external-test: &go-mockgen-external-test
    template: file://go-mockgen/go-mockgen.templ
    dir: '{{.InterfaceDirRelative}}'
    pkgname: '{{.SrcPackageName}}_test'
    filename: 'stub.{{.InterfaceFile | base | trimSuffix ".go"}}_test.go'
    structname: 'Mock{{.InterfaceName | firstUpper}}'
  go-mockgen-another-pkg: &go-mockgen-another-pkg
    template: file://go-mockgen/go-mockgen.templ
    dir: '{{.InterfaceDirRelative}}/gomockgentest'
    pkgname: gomockgentest
    filename: 'stub.{{.InterfaceFile | base}}'
    structname: 'Mock{{.InterfaceName | firstUpper}}'
  fake: &fake
    template: file://fake/fake.templ
    dir: '{{.InterfaceDirRelative}}'
    pkgname: '{{.SrcPackageName}}'
    filename: 'fake.{{.InterfaceFile | base}}'
    structname: 'Fake{{.InterfaceName | firstUpper}}'
  fake-internal-test: &fake-internal-test
    template: file://fake/fake.templ
    dir: '{{.InterfaceDirRelative}}'
    pkgname: '{{.SrcPackageName}}'
    filename: 'fake.internal_test.go'
    structname: 'FakeInternal{{.InterfaceName | firstUpper}}'
  fake-external-test: &fake-external-test
    template: file://fake/fake.templ
    dir: '{{.InterfaceDirRelative}}'
    pkgname: '{{.SrcPackageName}}_test'
    filename: 'fake.{{.InterfaceFile | base | trimSuffix ".go"}}_test.go'
    structname: 'Fake{{.InterfaceName | firstUpper}}'
  fake-another-pkg: &fake-another-pkg
    template: file://fake/fake.templ
    dir: '{{.InterfaceDirRelative}}/faketest'
    pkgname: faketest
    filename: 'fake.{{.InterfaceFile | base}}'
    structname: 'Fake{{.InterfaceName | firstUpper}}'
  all: &all
    - *go-mockgen
    - *go-mockgen-internal-test
    - *go-mockgen-external-test
    - *go-mockgen-another-pkg
    - *fake
    - *fake-internal-test
    - *fake-external-test
    - *fake-another-pkg
packages:
  github.com/powerman/mockery-templates/fake:
    interfaces:
      Store: {config: *fake}
  github.com/powerman/mockery-templates/go-mockgen:
    interfaces:
      Store: {config: *go-mockgen}
  github.com/powerman/mockery-templates/internal/fixture:
    interfaces:
      Repo:
        configs: *all
      Variadic:
        configs: *all
      NoResults:
        configs: *all
      Collide:
        configs: *all
      Swapper:
        configs: *all
      ReadCloser:
        configs: *all
      I1:
        configs: *all
      I2:
        configs: *all
      I3:
        configs: *all
      I4:
        configs: *all
      Cmp:
        configs: *all
      Empty:
        configs: *all
      CallFields:
        config: *fake-another-pkg
      unexported:
        configs: [*go-mockgen, *go-mockgen-internal-test, *fake, *fake-internal-test]
